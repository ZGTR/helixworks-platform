name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
      - name: Verify pinned pnpm
        run: test "$(pnpm --version)" = "11.21.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm smoke:product

  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Check Terraform formatting
        run: terraform -chdir=infra/terraform fmt -check -recursive
      - name: Validate Terraform
        run: |
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate
      - name: Validate local Compose model
        run: docker compose -f deploy/compose.yaml config --quiet
